<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | BackupBuddy AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main style="max-width:480px;margin:8vh auto;padding:24px">
    <div class="panel">
      <div class="logo">BackupBuddy//AI<small>secure administrator sign-in</small></div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
      {% endwith %}
      <h1>Sign in</h1>
      <p class="muted">Use the administrator credentials configured for this deployment.</p>
      <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus style="width:100%;margin:8px 0 16px;padding:12px">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required style="width:100%;margin:8px 0 18px;padding:12px">
        <button type="submit" style="width:100%">sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
